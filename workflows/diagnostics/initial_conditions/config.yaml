# -----------------------------------------------------------------------
# Pilot configuration
# -----------------------------------------------------------------------
pilot:
  # Set pilot_only: true to process only pilot_date (fast validation).
  # Set to false to process all start_dates in the campaign.
  pilot_only: true
  pilot_date: "1980-05-01-00000"

# -----------------------------------------------------------------------
# Component file patterns
# -----------------------------------------------------------------------
components:
  atm:
    file_glob: "*.eam.i.*.nc"
    per_member: true
    member_pattern: 'EN\d{2}'
  lnd:
    file_glob: "*.elm.r.*.nc"
    per_member: false
  ocn:
    file_glob: "*.mpaso.rst.*.nc"
    per_member: false
  ice:
    file_glob: "*.mpassi.rst.*.nc"
    per_member: false
  rof:
    file_glob: "*.mosart.r.*.nc"
    per_member: false
  cpl:
    file_glob: "*.cpl.r.*.nc"
    per_member: false

# -----------------------------------------------------------------------
# Hashing policy
# -----------------------------------------------------------------------
hashing:
  # Atmosphere: always hash all members (control check)
  atm_hash_all_members: true
  # Non-atmosphere: one hash per start date is sufficient for the first
  # pass; set to true for a complete per-member audit
  non_atm_hash_per_member: false

# -----------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------
output:
  # Explicit Perlmutter roots for durable diagnostics and public figures.
  output_root: "/global/cfs/cdirs/e3sm/S2S2D/s2d_diag/multimodel/initial_conditions"
  figure_outdir: "/global/cfs/cdirs/e3sm/www/zhan391/esp-lab_diag/initial_conditions"
  subdirs:
    manifests: "manifests"
    file_comparison: "file_comparison"
    variable_statistics: "variable_statistics"
    maps: "maps"
    profiles: "profiles"
    campaign_summary: "campaign_summary"

# -----------------------------------------------------------------------
# NetCDF / Dask
# -----------------------------------------------------------------------
dask:
  cluster_type: "local"   # local | slurm | none
  workers: 8
  cores: 4
  memory: "16GB"
  walltime: "04:00:00"

netcdf:
  chunks: {}   # empty = let xarray choose; or e.g. {nCells: 10000}
  engine: "netcdf4"

# -----------------------------------------------------------------------
# Scientific diagnostic policy
# -----------------------------------------------------------------------
diagnostics:
  # Used only when an absolute, unit-aware threshold is not supplied below.
  # The fallback is scale-aware and makes the exceedance metric comparable,
  # but campaign publications should use reviewed absolute thresholds.
  default_threshold_sigma_fraction: 0.01
  constant_field_threshold: 1.0e-10

  # Exact variable-name overrides in native units.  Add entries only after
  # confirming the restart-file units in Step 2.
  meaningful_thresholds:
    atm: {}
    lnd: {}
    ocn: {}
    ice: {}
    rof: {}

  # Maps and profiles are selected by scientific relevance, not raw RMSE.
  # Matching is case-insensitive substring matching to tolerate model naming.
  fingerprint_keywords:
    lnd: ["h2osoi", "soilwater", "h2osno", "swe", "t_soisno", "t_grnd"]
    ocn: ["temperature", "salinity", "sst", "ssh"]
    ice: ["iceconcentration", "aice", "icethickness", "vice", "snowvolume"]
    rof: ["river", "storage", "volr", "h2o"]
