# =============================================================================
# config.yaml
# IC Analysis Workflow — User Configuration
# =============================================================================
# All user-facing knobs are defined here.  Workflow scripts read this file and
# override individual values via command-line flags where appropriate.
#
# Environment-specific items to verify on NERSC:
#   1. restart_root — base path containing BruteForce/ and JRA55-FOSIRL/
#   2. output_root  — where to write output (local or shared NERSC FS)
# =============================================================================

# -----------------------------------------------------------------------
# Experiment pair
# -----------------------------------------------------------------------
experiments:
  ref_label: "BruteForce"
  test_label: "JRA55-FOSIRL"

  # Root directories that directly contain YYYY-MM-DD-00000/ sub-directories.
  # Override with the ESP_LAB_IC_REF_ROOT / ESP_LAB_IC_TEST_ROOT env vars
  # if the paths differ across machines.
  ref_root: "${ESP_LAB_IC_REF_ROOT:/global/cfs/cdirs/e3sm/zhan391/v3.LR.S2D.ENSINT/BruteForce}"
  test_root: "${ESP_LAB_IC_TEST_ROOT:/global/cfs/cdirs/e3sm/zhan391/v3.LR.S2D.ENSINT/JRA55-FOSIRL}"

# -----------------------------------------------------------------------
# Ensemble members (shared atmospheric IC)
# -----------------------------------------------------------------------
members:
  - EN00
  - EN01
  - EN02
  - EN03
  - EN04
  - EN05
  - EN06
  - EN07
  - EN08
  - EN09

